plugins {
    id 'java'
    id 'io.github.goooler.shadow' version '8.1.7'
}

group = 'org.demonz.dev'
version = '2.1.3'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://jitpack.io/' }
    maven { url 'https://repo.luckperms.net/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'org.jetbrains:annotations:24.1.0'

    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    implementation 'org.slf4j:slf4j-nop:2.0.13'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.github.seeseemelk:MockBukkit-v1.20:3.76.0'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'me.clip:placeholderapi:2.11.6'
    testImplementation 'net.luckperms:api:5.4'
    testImplementation 'com.github.MilkBowl:VaultAPI:1.7.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    def props = [version: project.version]
    inputs.properties(props)
    filesMatching('plugin.yml') {
        expand(props)
    }
}

shadowJar {
    archiveBaseName.set('DZEconomy')
    archiveVersion.set(project.version)
    archiveClassifier.set('')

    mergeServiceFiles()

    relocate 'com.google.gson', 'org.demonz.dev.dzeconomy.libs.gson'
    relocate 'com.zaxxer.hikari', 'org.demonz.dev.dzeconomy.libs.hikari'
    relocate 'org.slf4j', 'org.demonz.dev.dzeconomy.libs.slf4j'
    relocate 'org.bstats', 'org.demonz.dev.dzeconomy.libs.bstats'
    relocate 'com.github.benmanes.caffeine', 'org.demonz.dev.dzeconomy.libs.caffeine'
    relocate 'org.checkerframework', 'org.demonz.dev.dzeconomy.libs.checkerframework'
    relocate 'com.google.errorprone', 'org.demonz.dev.dzeconomy.libs.errorprone'
    relocate 'com.google.j2objc', 'org.demonz.dev.dzeconomy.libs.j2objc'
    relocate 'com.google.thirdparty', 'org.demonz.dev.dzeconomy.libs.thirdparty'
    relocate 'javax.annotation', 'org.demonz.dev.dzeconomy.libs.javaxannotation'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/native-image/**'
    exclude 'META-INF/module-info.class'
    exclude 'META-INF/versions/**/module-info.class'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}
